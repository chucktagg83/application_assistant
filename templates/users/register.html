{% extends 'base.html' %}
{% load static %}

{% block title %}
    Register a New User
{% endblock %}


{% block content %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <h1>Register a New User</h1>
    <form class="sign-up-form" action="{% url 'applications:register' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="form-submit">Register</button>
    </form>
{% endblock %}
